{% extends "base.html" %}

{% block title %}

Profile

{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-header bg-primary text-white">

                    <h3>

                        👤 User Profile

                    </h3>

                </div>

                <div class="card-body">

                    <div class="text-center mb-4">

                        <img
                            src="{{ url_for('static', filename='images/logo.png') }}"
                            class="rounded-circle border shadow"
                            width="150"
                            height="150">

                        <h3 class="mt-3">

                            {{ user.name }}

                        </h3>

                        <p class="text-muted">

                            Student Attendance Administrator

                        </p>

                    </div>

                    <hr>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="fw-bold">

                                Full Name

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                value="{{ user.name }}"
                                readonly>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="fw-bold">

                                Username

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                value="{{ user.username }}"
                                readonly>

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="fw-bold">

                                Email

                            </label>

                            <input
                                type="email"
                                class="form-control"
                                value="{{ user.email }}"
                                readonly>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="fw-bold">

                                Phone

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                value="{{ user.phone }}"
                                readonly>

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="fw-bold">

                                Account Created

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                value="{{ user.created_at }}"
                                readonly>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="fw-bold">

                                Status

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                value="Active"
                                readonly>

                        </div>

                    </div>

                    <hr>

                    <div class="text-center">

                        <a
                            href="{{ url_for('dashboard') }}"
                            class="btn btn-primary">

                            🏠 Dashboard

                        </a>

                        <a
                            href="{{ url_for('students') }}"
                            class="btn btn-success">

                            👨‍🎓 Students

                        </a>

                        <a
                            href="{{ url_for('attendance') }}"
                            class="btn btn-warning">

                            📅 Attendance

                        </a>

                        <a
                            href="{{ url_for('logout') }}"
                            class="btn btn-danger">

                            🚪 Logout

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}

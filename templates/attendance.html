{% extends "base.html" %}

{% block title %}Attendance{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow-lg border-0 rounded-4">

        <div class="card-header bg-primary text-white">

            <h3 class="mb-0">
                📅 Mark Student Attendance
            </h3>

        </div>

        <div class="card-body">

            <form action="{{ url_for('attendance') }}" method="POST">

                <!-- Attendance Date -->

                <div class="row mb-4">

                    <div class="col-md-4">

                        <label class="form-label">
                            Attendance Date
                        </label>

                        <input
                            type="date"
                            id="attendance_date"
                            name="attendance_date"
                            class="form-control"
                            required>

                    </div>

                </div>

                <!-- Student Attendance Table -->

                <div class="table-responsive">

                    <table class="table table-bordered table-hover align-middle">

                        <thead class="table-dark">

                        <tr>

                            <th>#</th>

                            <th>Roll No</th>

                            <th>Student Name</th>

                            <th>Status</th>

                        </tr>

                        </thead>

                        <tbody>

                        {% for student in students %}

                        <tr>

                            <td>{{ loop.index }}</td>

                            <td>{{ student.roll_no }}</td>

                            <td>{{ student.name }}</td>

                            <td>

                                <select
                                    class="form-select"
                                    name="status_{{ student.id }}">

                                    <option value="Present">
                                        Present
                                    </option>

                                    <option value="Absent">
                                        Absent
                                    </option>

                                    <option value="Leave">
                                        Leave
                                    </option>

                                </select>

                            </td>

                        </tr>

                        {% endfor %}

                        </tbody>

                    </table>

                </div>

                <div class="text-end">

                    <button
                        class="btn btn-success btn-lg"
                        type="submit">

                        💾 Save Attendance

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
